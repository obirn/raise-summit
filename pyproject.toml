[project]
name = "docklock"
version = "0.1.0"
description = "Autonomous logistics agent with Gemini Computer Use, deterministic safety middleware, and Playwright execution."
requires-python = ">=3.11"
dependencies = [
  "google-genai>=2.7.0",
  "playwright>=1.44.0",
  "websockets>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
docklock = "docklock.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
